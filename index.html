<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>clobie.github.io</title>

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="styles.css">
	<script src="category.js" defer></script>
	<script src="scripts.js" defer></script>
</head>

<body>

<header>
	<div class="logo">
		<div class="logo-dot"></div>
		<span>clobie.github.io</span>
	</div>
</header>

<div class="layout">

	<aside class="sidebar">
		<div id="sidebarCategories"></div>

		<div class="sidebar-card description-card" id="descriptionCard">
			<div class="sidebar-label">Description</div>
			<div class="description-text" id="descriptionText"></div>
			<div class="details-list" id="detailsList"></div>
		</div>
	</aside>

	<div class="game-area">

		<div class="viewport-wrapper">
			<div class="viewport-topbar">
				<div class="dot dot-red"></div>
				<div class="dot dot-yellow"></div>
				<div class="dot dot-green"></div>

				<span class="viewport-title" id="viewportTitle"></span>

				<button class="fullscreen-btn"
					onclick="document.querySelector('.aspect-box').requestFullscreen()">
					⛶ fullscreen
				</button>
			</div>

			<div class="aspect-box">
				<iframe id="game-frame" src="" allowfullscreen></iframe>
			</div>
		</div>

		<div class="info-bar">
			<div>
				<div class="info-title" id="game-title"></div>
				<div class="info-desc" id="game-desc"></div>
				<div class="info-tag" id="game-tag"></div>
			</div>

			<div class="click-hint" id="clickHint">
				click inside to<br>
				capture <span>keyboard focus</span>
			</div>
		</div>

	</div>

</div>

</body>
</html>
