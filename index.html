<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Steve</title>
    <style>
        :root {
            --bg-color: #1a1a1a;
            --panel-color: #262626;
            --text-color: #e0e0e0;
            --accent-color: #fa5c5c;
        }

        body {
            font-family: sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            background-color: var(--panel-color);
            text-align: center;
            border-bottom: 4px solid var(--accent-color);
        }

        .container {
            max-width: 960px;
            width: 100%;
            padding: 20px;
        }

        .game-wrapper {
            background: #000;
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: center;
        }

        iframe {
            width: 800px;
            height: 600px;
            border: none;
        }

        .info-panel {
            margin-top: 20px;
            padding: 20px;
            background: var(--panel-color);
            border-radius: 8px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Steve</h1>
    </header>

    <div class="container">
        <div class="game-wrapper">
            <!-- Ensure this path is correct for your repo structure -->
            <iframe src="web_build/tentacle/index.html" allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen></iframe>
        </div>

        <div class="info-panel">
            <h2>About this game</h2>
            <p>His name is steve</p>
            <h3>Controls</h3>
            <ul>
                <li><strong>W:</strong> Wall Hold</li>
                <li><strong>A:</strong> Move Left</li>
                <li><strong>D:</strong> Move Right</li>
                <li><strong>Space:</strong> Jump</li>
            </ul>
        </div>
    </div>

    <script>
        // Ensures game catches focus on click
        document.querySelector('iframe').addEventListener('load', function() {
            this.contentWindow.focus();
        });
        document.body.addEventListener('click', () => {
            document.querySelector('iframe').focus();
        });
    </script>
</body>
</html>
