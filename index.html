<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clobie.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0d0d0f;
            --surface: #141416;
            --surface2: #1c1c20;
            --border: rgba(255,255,255,0.07);
            --border-accent: rgba(250, 92, 92, 0.4);
            --text: #f0ede8;
            --muted: #7a7770;
            --accent: #fa5c5c;
            --accent2: #ff8c42;
            --glow: rgba(250, 92, 92, 0.15);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0,0,0,0.03) 2px,
                rgba(0,0,0,0.03) 4px
            );
            pointer-events: none;
            z-index: 9999;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(13,13,15,0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            display: flex;
            align-items: center;
            height: 60px;
        }

        .logo {
            font-family: 'Syne', sans-serif;
            font-weight: 800;
            font-size: 1.1rem;
            letter-spacing: -0.02em;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent);
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.7); }
        }

        .layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 2rem 4rem;
            gap: 1rem;
        }
        #sidebarCategories {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }
        .sidebar {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .sidebar-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }

        .sidebar-label {
            font-size: 0.65rem;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--muted);
            padding: 12px 16px 8px;
            border-bottom: 1px solid var(--border);
        }

        .game-list-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            cursor: pointer;
            transition: background 0.15s;
            border-bottom: 1px solid var(--border);
        }

        .game-list-item:last-child { border-bottom: none; }
        .game-list-item:hover { background: var(--surface2); }

        .game-list-item.active {
            background: rgba(250, 92, 92, 0.06);
            border-left: 2px solid var(--accent);
        }

        .game-icon {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            background: var(--surface2);
            border: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            flex-shrink: 0;
        }

        .game-list-item.active .game-icon {
            background: rgba(250, 92, 92, 0.1);
            border-color: var(--border-accent);
        }

        .game-list-meta { flex: 1; min-width: 0; }

        .game-list-name {
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text);
            line-height: 1.2;
        }

        .game-list-item.active .game-list-name { color: var(--accent); }

        .game-list-sub {
            font-size: 0.68rem;
            color: var(--muted);
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .play-badge {
            font-size: 0.6rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            background: rgba(250, 92, 92, 0.1);
            border: 1px solid rgba(250, 92, 92, 0.25);
            padding: 2px 6px;
            border-radius: 3px;
        }

        .controls-list {
            padding: 12px 16px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-row {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
        }

        .key {
            background: var(--surface2);
            border: 1px solid rgba(255,255,255,0.12);
            border-bottom-width: 2px;
            border-radius: 4px;
            padding: 2px 7px;
            font-size: 0.7rem;
            font-family: 'DM Mono', monospace;
            color: var(--text);
            min-width: 32px;
            text-align: center;
            flex-shrink: 0;
        }

        .control-desc { color: var(--muted); }

        /* controls card hidden when no controls (e.g. software items) */
        .controls-card.hidden { display: none; }

        .game-area { display: flex; flex-direction: column; gap: 1.25rem; }

        .viewport-wrapper {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(250, 92, 92, 0.05), inset 0 0 1px rgba(255,255,255,0.05);
        }

        .viewport-topbar {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 14px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .dot { width: 10px; height: 10px; border-radius: 50%; }
        .dot-red { background: #ff5f57; }
        .dot-yellow { background: #febc2e; }
        .dot-green { background: #28c840; }

        .viewport-title {
            font-size: 0.72rem;
            color: var(--muted);
            letter-spacing: 0.08em;
            margin-left: auto;
            margin-right: auto;
        }

        .aspect-box {
            position: relative;
            width: 100%;
            padding-top: 56.29%; /* 16:9 */
        }

        .aspect-box iframe {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        .fullscreen-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.68rem;
            font-family: 'DM Mono', monospace;
            cursor: pointer;
            letter-spacing: 0.05em;
            transition: color 0.15s, border-color 0.15s;
        }

        .fullscreen-btn:hover { color: var(--text); border-color: var(--border-accent); }

        .info-bar {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 16px 20px;
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 2rem;
        }

        .info-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: -0.02em;
        }

        .info-desc {
            font-size: 0.78rem;
            color: var(--muted);
            margin-top: 4px;
            line-height: 1.6;
            max-width: 420px;
        }

        .info-tag {
            font-size: 0.65rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--accent2);
            background: rgba(255, 140, 66, 0.1);
            border: 1px solid rgba(255, 140, 66, 0.2);
            padding: 3px 8px;
            border-radius: 3px;
            margin-top: 8px;
            display: inline-block;
        }

        .click-hint {
            font-size: 0.7rem;
            color: var(--muted);
            text-align: right;
            white-space: nowrap;
            padding-top: 4px;
        }

        .click-hint span { color: var(--accent); }

        /* click-hint hidden for software (no iframe focus needed) */
        .click-hint.hidden { display: none; }

        @keyframes fadeSlide {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .game-area { animation: fadeSlide 0.3s ease; }

        @media (max-width: 780px) {
            .layout {
                grid-template-columns: 1fr;
                padding: 1rem;
            }
            header { padding: 0 1rem; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <div class="logo-dot"></div>
        <span>clobie.github.io</span>
    </div>
</header>

<div class="layout">

    <aside class="sidebar">
        <!-- Category sections are built dynamically -->
        <div id="sidebarCategories"></div>

        <div class="sidebar-card controls-card" id="controlsCard">
            <div class="sidebar-label">Controls</div>
            <div class="controls-list" id="controlsList"></div>
        </div>
    </aside>

    <div class="game-area">
        <div class="viewport-wrapper">
            <div class="viewport-topbar">
                <div class="dot dot-red"></div>
                <div class="dot dot-yellow"></div>
                <div class="dot dot-green"></div>
                <span class="viewport-title" id="viewportTitle"></span>
                <button class="fullscreen-btn" onclick="document.querySelector('.aspect-box').requestFullscreen()">⛶ fullscreen</button>
            </div>
            <div class="aspect-box">
                <iframe id="game-frame" src="" allowfullscreen></iframe>
            </div>
        </div>

        <div class="info-bar">
            <div>
                <div class="info-title" id="game-title"></div>
                <div class="info-desc" id="game-desc"></div>
                <div class="info-tag" id="game-tag"></div>
            </div>
            <div class="click-hint" id="clickHint">click inside to<br>capture <span>keyboard focus</span></div>
        </div>
    </div>

</div>

<script>
    // ── DATA ─────────────────────────────────────────────────────────────────
    // Each category has a label and an array of items.
    // For games: provide `folder` (loaded in iframe) and optional `controls`.
    // For software: provide `url` (external link opened in iframe or new tab).
    // Set `newTab: true` if the item should open in a new tab instead of the iframe.
    const categories = [
        {
            label: 'Home',
            items: [
                {
                    name: 'Home',
                    desc: 'Welcome.',
                    tag: 'home',
                    icon: '🏠',
                    url: 'home/index.html',
                }
            ]
        },
        {
            label: 'Game Scratchboard',
            items: [
                {
                    folder: 'tentacle',
                    name: 'Steve is dreaming',
                    desc: 'His name is steve.',
                    tag: 'platformer',
                    icon: '🐙',
                    controls: [
                        { key: 'W',   desc: 'Wall Hold' },
                        { key: 'A',   desc: 'Move Left' },
                        { key: 'D',   desc: 'Move Right' },
                        { key: 'SPC', desc: 'Jump' },
                    ]
                },
                {
                    folder: 'orbdemo',
                    name: 'Orb Puzzle Thing',
                    desc: 'Put orb in thing. Fight boss.',
                    tag: 'platformer',
                    icon: '🔮',
                    controls: [
                        { key: 'W',   desc: 'Wall Hold' },
                        { key: 'S',   desc: 'Wall Slide (while wall holding)' },
                        { key: 'A',   desc: 'Move Left' },
                        { key: 'D',   desc: 'Move Right' },
                        { key: 'SPC', desc: 'Jump / Double Jump' },
                        { key: 'LMB', desc: 'Shoot — kills enemies, pushes orbs' },
                        { key: 'RMB', desc: 'Gravity Gun — pulls orbs' },
                    ]
                },
                {
                    folder: 'space',
                    name: 'Space Game Thing',
                    desc: 'All you can do is fly around lol',
                    tag: 'topdown-shooter',
                    icon: '🚀',
                    controls: [
                        { key: 'LMB', desc: 'Thrust' },
                        { key: 'RMB', desc: 'Laser' },
                    ]
                }
            ]
        },
        {
            label: 'Terminal Emulator',
            items: [
                {
                    name: 'Console',
                    desc: 'clobie_os. extremely basic terminal emulator.  browse folders, read files.',
                    tag: 'portfolio project',
                    icon: '🏠',
                    url: 'https://www.clobie.net',
                    controls: [
                        { key: 'ls',    desc: 'List directory contents' },
                        { key: 'cd',    desc: 'Change the current directory' },
                        { key: 'cat',   desc: 'Read and display file contents' },
                        { key: 'clear', desc: 'Clear the terminal screen' },
                        { key: 'pwd',   desc: 'Print working directory' }
                    ]
                }
            ]
        },
    ];

    // ── STATE ─────────────────────────────────────────────────────────────────
    let currentCatIdx  = 0;
    let currentItemIdx = 0;

    // Flat lookup: { catIdx, itemIdx } by a unique key
    function itemKey(ci, ii) { return `${ci}-${ii}`; }

    // ── BUILD SIDEBAR ─────────────────────────────────────────────────────────
    function buildSidebar() {
        const container = document.getElementById('sidebarCategories');
        container.innerHTML = categories.map((cat, ci) => `
            <div class="sidebar-card">
                <div class="sidebar-label">${cat.label}</div>
                <div id="list-${ci}">
                    ${cat.items.map((item, ii) => `
                        <div class="game-list-item ${ci === 0 && ii === 0 ? 'active' : ''}"
                             id="item-${ci}-${ii}"
                             onclick="switchItem(${ci}, ${ii})">
                            <div class="game-icon">${item.icon}</div>
                            <div class="game-list-meta">
                                <div class="game-list-name">${item.name}</div>
                                <div class="game-list-sub">${item.tag}</div>
                            </div>
                            ${ci === 0 && ii === 0 ? '<span class="play-badge">active</span>' : ''}
                        </div>
                    `).join('')}
                </div>
            </div>
        `).join('');
    }

    // ── SWITCH ITEM ───────────────────────────────────────────────────────────
    function switchItem(ci, ii) {
        // Deactivate previous
        const prev = document.getElementById(`item-${currentCatIdx}-${currentItemIdx}`);
        if (prev) {
            prev.classList.remove('active');
            const badge = prev.querySelector('.play-badge');
            if (badge) badge.remove();
        }

        currentCatIdx  = ci;
        currentItemIdx = ii;

        const item = categories[ci].items[ii];

        // Activate new
        const el = document.getElementById(`item-${ci}-${ii}`);
        if (el) {
            el.classList.add('active');
            el.insertAdjacentHTML('beforeend', '<span class="play-badge">active</span>');
        }

        // Resolve src
        const isFolder = !!item.folder;
        const src = isFolder
            ? `web_build/${item.folder}/index.html`
            : (item.url || '');

        if (item.newTab && src) {
            window.open(src, '_blank');
        } else {
            document.getElementById('game-frame').src = src;
        }

        document.getElementById('viewportTitle').textContent = src;
        document.getElementById('game-title').textContent   = item.name;
        document.getElementById('game-desc').textContent    = item.desc;
        document.getElementById('game-tag').textContent     = item.tag;

        // Controls card: show only if item has controls
        const hasControls = item.controls && item.controls.length > 0;
        document.getElementById('controlsCard').classList.toggle('hidden', !hasControls);
        if (hasControls) {
            document.getElementById('controlsList').innerHTML = item.controls.map(c => `
                <div class="control-row">
                    <span class="key">${c.key}</span>
                    <span class="control-desc">${c.desc}</span>
                </div>
            `).join('');
        }

        // Click hint: only for iframe-based items
        document.getElementById('clickHint').classList.toggle('hidden', !!item.newTab);
    }

    // ── INIT ──────────────────────────────────────────────────────────────────
    buildSidebar();
    switchItem(0, 0);

    document.addEventListener('click', () => {
        try { document.getElementById('game-frame').contentWindow.focus(); } catch(e) {}
    });
</script>
</body>
</html>
