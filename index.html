<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>clobie.github.io</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d0d0f; --surface: #141416; --surface2: #1c1c20; --border: rgba(255,255,255,0.07); --border-accent: rgba(250, 92, 92, 0.4); --text: #f0ede8; --muted: #7a7770; --accent: #fa5c5c; --accent2: #ff8c42; }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'DM Mono', monospace; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        header { position: sticky; top: 0; z-index: 100; background: rgba(13,13,15,0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); padding: 0 2rem; display: flex; align-items: center; height: 60px; }
        .logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .logo-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
        .layout { display: grid; grid-template-columns: 260px 1fr; max-width: 1280px; margin: 0 auto; padding: 2rem; gap: 1rem; }
        .sidebar-card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; margin-bottom: 1rem; }
        .sidebar-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); padding: 12px 16px 8px; border-bottom: 1px solid var(--border); }
        .game-list-item { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; transition: background 0.15s; border-bottom: 1px solid var(--border); }
        .game-list-item:hover { background: var(--surface2); }
        .game-list-item.active { background: rgba(250, 92, 92, 0.06); border-left: 2px solid var(--accent); }
        .game-icon { width: 36px; height: 36px; border-radius: 8px; background: var(--surface2); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .game-list-name { font-family: 'Syne', sans-serif; font-size: 0.85rem; font-weight: 700; }
        .viewport-wrapper { border-radius: 10px; overflow: hidden; background: #000; border: 1px solid var(--border); }
        .aspect-box { position: relative; width: 100%; padding-top: 56.29%; }
        .aspect-box iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: none; }
        .info-bar { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px 20px; display: flex; justify-content: space-between; margin-top: 1.25rem; }
        .controls-card.hidden { display: none; }
        .control-row { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; padding: 4px 16px; }
        .key { background: var(--surface2); border: 1px solid rgba(255,255,255,0.12); border-radius: 4px; padding: 2px 7px; font-size: 0.7rem; color: var(--text); }
        @media (max-width: 780px) { .layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<header><div class="logo"><div class="logo-dot"></div><span>clobie.github.io</span></div></header>

<div class="layout">
    <aside class="sidebar">
        <div id="sidebarCategories"></div>
        <div class="sidebar-card controls-card" id="controlsCard">
            <div class="sidebar-label">Controls</div>
            <div id="controlsList"></div>
        </div>
    </aside>

    <div class="game-area">
        <div class="viewport-wrapper">
            <div class="aspect-box"><iframe id="game-frame" src="" allowfullscreen></iframe></div>
        </div>
        <div class="info-bar">
            <div>
                <div id="game-title" style="font-family:'Syne'; font-weight:800; font-size:1.1rem;"></div>
                <div id="game-desc" style="font-size:0.78rem; color:var(--muted); margin-top:4px;"></div>
            </div>
        </div>
    </div>
</div>

<script>
    const categories = [
        {
            label: 'Home',
            items: [
                {
                    name: 'Home',
                    desc: 'Welcome.',
                    tag: 'home',
                    icon: '🏠',
                    url: 'home/index.html',
                }
            ]
        },
        {
            label: 'Game Scratchboard',
            items: [
                {
                    folder: 'steve',
                    name: 'Steve is dreaming',
                    desc: 'His name is steve.',
                    tag: 'platformer',
                    icon: '🐙',
                    controls: [
                        { key: 'W',   desc: 'Wall Hold' },
                        { key: 'A',   desc: 'Move Left' },
                        { key: 'D',   desc: 'Move Right' },
                        { key: 'SPC', desc: 'Jump' },
                    ]
                },
                {
                    folder: 'orb',
                    name: 'Orb Puzzle Thing',
                    desc: 'Put orb in thing. Fight boss.',
                    tag: 'platformer',
                    icon: '🔮',
                    controls: [
                        { key: 'W',   desc: 'Wall Hold' },
                        { key: 'S',   desc: 'Wall Slide (while wall holding)' },
                        { key: 'A',   desc: 'Move Left' },
                        { key: 'D',   desc: 'Move Right' },
                        { key: 'SPC', desc: 'Jump / Double Jump' },
                        { key: 'LMB', desc: 'Shoot — kills enemies, pushes orbs' },
                        { key: 'RMB', desc: 'Gravity Gun — pulls orbs' },
                    ]
                },
                {
                    folder: 'space',
                    name: 'Space Game Thing',
                    desc: 'All you can do is fly around lol',
                    tag: 'topdown-shooter',
                    icon: '🚀',
                    controls: [
                        { key: 'LMB', desc: 'Thrust' },
                        { key: 'RMB', desc: 'Laser' },
                    ]
                }
            ]
        },
        {
            label: 'Terminal Emulator',
            items: [
                {
                    name: 'Console',
                    desc: 'clobie_os. extremely basic terminal emulator.  browse folders, read',
                    tag: 'portfolio project',
                    icon: '🏠',
                    url: 'https://www.clobie.net',
                    controls: [
                        { key: 'ls',    desc: 'List directory contents' },
                        { key: 'cd',    desc: 'Change the current directory' },
                        { key: 'cat',   desc: 'Read and display file contents' },
                        { key: 'clear', desc: 'Clear the terminal screen' },
                        { key: 'pwd',   desc: 'Print working directory' }
                    ]
                }
            ]
        },
    ];

    function buildSidebar() {
        const container = document.getElementById('sidebarCategories');
        container.innerHTML = categories.map(cat => `
            <div class="sidebar-card">
                <div class="sidebar-label">${cat.label}</div>
                ${cat.items.map(item => {
                    const slug = item.folder || item.tag || 'home';
                    return `
                    <div class="game-list-item" id="item-${slug}" onclick="navigateTo('${slug}')">
                        <div class="game-icon">${item.icon}</div>
                        <div class="game-list-name">${item.name}</div>
                    </div>`;
                }).join('')}
            </div>
        `).join('');
    }

    function navigateTo(slug) {
        const url = new URL(window.location);
        url.searchParams.set('nav', slug);
        window.history.pushState({}, '', url);
        loadGame(slug);
    }

    function loadGame(slug) {
        let item = null;
        categories.forEach(c => { 
            const found = c.items.find(i => (i.folder || i.tag || 'home') === slug); 
            if(found) item = found; 
        });
        if (!item) item = categories[0].items[0];

        const slugId = item.folder || item.tag || 'home';
        const src = item.url ? item.url : `web_build/${item.folder}/index.html`;
        
        document.getElementById('game-frame').src = src;
        document.getElementById('game-title').textContent = item.name;
        document.getElementById('game-desc').textContent = item.desc;

        document.querySelectorAll('.game-list-item').forEach(el => el.classList.remove('active'));
        const activeEl = document.getElementById(`item-${slugId}`);
        if (activeEl) activeEl.classList.add('active');

        const cCard = document.getElementById('controlsCard');
        if (item.controls) {
            cCard.classList.remove('hidden');
            document.getElementById('controlsList').innerHTML = item.controls.map(c => 
                `<div class="control-row"><span class="key">${c.key}</span><span>${c.desc}</span></div>`
            ).join('');
        } else {
            cCard.classList.add('hidden');
        }
    }

    buildSidebar();
    const params = new URLSearchParams(window.location.search);
    loadGame(params.get('nav'));

    window.addEventListener('popstate', () => {
        const p = new URLSearchParams(window.location.search);
        loadGame(p.get('nav'));
    });
</script>
</body>
</html>
